# Hand-edited. Things built outside the day job.
- title: Real-time traffic intelligence
  text: Detects traffic bottlenecks from maps data before jams form. Built with a local NGO and adopted by the city traffic authority.
- title: Voice-based exam assistant
  text: Reads printed question papers aloud and transcribes spoken answers, so visually impaired students can sit standard written exams independently.
- title: Federated education platform
  text: API design, schemas and protocols connecting schools to a central non-profit education board in Australia — built to proof of concept.
- title: Startup mentoring
  text: Technical mentor at Google for Startups, Startup School, accelerators and AI hackathons — mostly edtech, healthcare and social impact.
